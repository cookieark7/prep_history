# Local Postgres with pgvector for Chronicle (docs/PROTOTYPE_PLAN.md, section 8).
#   docker compose up -d db        then DATABASE_URL=postgres://chronicle:chronicle@localhost:5433/chronicle
# Port 5433 so it never clashes with a Postgres already on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chronicle-db
    environment:
      POSTGRES_USER: chronicle
      POSTGRES_PASSWORD: chronicle
      POSTGRES_DB: chronicle
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - chronicle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronicle -d chronicle"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  chronicle-db:
