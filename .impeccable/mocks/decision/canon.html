<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard · /start</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9FAFB;--card:#fff;--ink:#111827;--muted:#6B7280;--line:#E5E7EB;--brand:#4F46E5;--soft:#EEF2FF}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-columns:248px 1fr}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px}
.side .mark{font-weight:700;font-size:18px;padding:0 10px 18px;display:flex;align-items:center;gap:10px}
.side .mark i{width:28px;height:28px;border-radius:8px;background:var(--brand)}
.side a{padding:9px 10px;border-radius:8px;color:#374151;text-decoration:none;font-weight:500}
.side a.on{background:var(--soft);color:var(--brand)}
.main{padding:32px 40px;display:grid;grid-template-columns:1fr 360px;gap:24px;align-content:start}
h1{grid-column:1/-1;font-size:26px;font-weight:700}
.ask{grid-column:1/-1;display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 1px 2px #0000000d}
.ask input{flex:1;border:0;font:inherit;font-size:16px;padding:0 10px}
.ask button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:16px;font-weight:600;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat b{display:block;font-size:28px}
.stat span{color:var(--muted);font-size:13px}
.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:4px}
.course{border:1px solid var(--line);border-radius:12px;padding:14px}
.course b{display:block}
.course span{color:var(--muted);font-size:13px}
.prog{height:6px;background:var(--line);border-radius:6px;margin-top:10px}
.prog u{display:block;height:100%;background:var(--brand);border-radius:6px}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand) 0 62%,var(--line) 0);display:grid;place-items:center;margin:6px auto 14px}
.ring b{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:11px;font-weight:600}
</style></head><body>
<aside class="side"><span class="mark"><i></i>Chronicle</span>
<a class="on" href="#">Home</a><a href="#">Review</a><a href="#">Courses</a><a href="#">Progress</a><a href="#">Settings</a></aside>
<div class="main">
<h1>Good evening</h1>
<div class="ask"><input placeholder="Ask about any history topic"><button>Ask</button></div>
<div class="card"><h2>This week</h2>
<div class="stats"><div class="stat"><b>12</b><span>Lessons</span></div><div class="stat"><b>86%</b><span>Recall</span></div><div class="stat"><b>5 days</b><span>Streak</span></div></div>
<h2 style="margin-top:22px">Your courses</h2>
<div class="courses">
<div class="course"><b>Ancient India</b><span>4 of 18 topics</span><div class="prog"><u style="width:22%"></u></div></div>
<div class="course"><b>Medieval India</b><span>1 of 16 topics</span><div class="prog"><u style="width:6%"></u></div></div>
<div class="course"><b>Modern India</b><span>0 of 22 topics</span><div class="prog"><u style="width:0"></u></div></div>
<div class="course"><b>World history</b><span>2 of 12 topics</span><div class="prog"><u style="width:16%"></u></div></div>
</div></div>
<div class="card"><h2>Daily review</h2><div class="ring"><b>8</b></div><p style="text-align:center;color:var(--muted);margin-bottom:14px">cards due · about 5 minutes</p><span class="btn">Start review</span></div>
</div>
</body></html>
